# ============================================================================
# 🛡️ GITLEAKS CONFIGURATION — SECRET SCANNING RULES FOR MOBILE PROJECTS
# ============================================================================

title = "Enterprise Mobile Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Allowlisted files and paths"
paths = [
  '''^\.git''',
  '''node_modules''',
  '''Pods''',
  '''android/build''',
  '''ios/build''',
  '''coverage''',
  '''yarn\.lock$''',
  '''package-lock\.json$''',
  '''\.example$''',
  '''mock.*'''
]
regexes = [
  '''(?i)example''',
  '''(?i)test''',
  '''(?i)dummy'''
]
