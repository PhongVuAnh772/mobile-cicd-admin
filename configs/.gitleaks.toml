[title]
description = "Gitleaks secret scanning configuration for CryptoVaultRN"

[[rules]]
description = "Generic API Key"
id = "generic-api-key"
regex = '''(?i)(api_key|apikey|secret_key|private_key)\s*[:=]\s*["']([0-9a-zA-Z]{16,64})["']'''
tags = ["key", "generic"]

[[rules]]
description = "Firebase Private Key"
id = "firebase-private-key"
regex = '''-----BEGIN PRIVATE KEY-----\n[A-Za-z0-9+/=\n]+-----END PRIVATE KEY-----'''
tags = ["firebase", "key"]

[[rules]]
description = "JWT Token"
id = "jwt-token"
regex = '''eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*'''
tags = ["jwt", "token"]

[allowlist]
description = "Global allowlist"
paths = [
  '''package-lock\.json''',
  '''yarn\.lock''',
  '''\.github/workflows/.*'''
]
