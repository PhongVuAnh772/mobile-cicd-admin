services:
  - type: web
    name: ota-distribution-v1
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd ota-distribution/server && npm install
    startCommand: cd ota-distribution/server && node index.js
    envVars:
      - key: PORT
        value: 3000
      - key: BASE_URL
        value: https://ota-distribution-v1.onrender.com
      - key: NODE_ENV
        value: production
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
