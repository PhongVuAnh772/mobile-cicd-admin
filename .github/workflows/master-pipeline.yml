name: "Centralized Admin Reusable Mobile Pipeline"

# ============================================================================
# CENTRALIZED REUSABLE WORKFLOW FOR ENTERPRISE MOBILE APPS
# Managed exclusively by Admins & Release Managers in `phong-mobile/mobile-cicd-admin`
# Developers in consumer repositories CANNOT view or modify this pipeline.
# ============================================================================
on:
  workflow_call:
    inputs:
      app_name:
        description: "Tên ứng dụng mobile"
        required: false
        type: string
        default: "MobileApp"
      environment:
        description: "Môi trường: development | staging | production"
        required: false
        type: string
        default: "production"
      skip_tests:
        description: "Bỏ qua bước CI tests"
        required: false
        type: boolean
        default: false
      project_path:
        description: "Đường dẫn thư mục dự án chứa package.json (mặc định: auto-detect)"
        required: false
        type: string
        default: "."
      build_ios:
        description: "Kích hoạt build iOS trên macOS runner (true | false)"
        required: false
        type: boolean
        default: false
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_S3_BUCKET:
        required: false
      AWS_REGION:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      GPLAY_SERVICE_ACCOUNT_JSON:
        required: false
      OTA_SERVER_URL:
        required: false
      APP_STORE_CONNECT_API_KEY_KEY:
        required: false
      APP_STORE_CONNECT_API_KEY_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_ISSUER_ID:
        required: false
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      PROVISIONING_PROFILE_BASE64:
        required: false
      MATCH_PASSWORD:
        required: false
      MATCH_GIT_URL:
        required: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. CI — LINT, TYPE CHECK, UNIT TESTS (All branches & PRs)
  # ──────────────────────────────────────────────────────────────────────────
  ci-checks:
    name: "🧪 CI — Lint, TypeCheck & Unit Tests"
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Consumer App Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Project Root & Install Dependencies
        run: |
          PROJECT_ROOT="${{ inputs.project_path }}"
          if [ "$PROJECT_ROOT" = "." ] && [ ! -f "package.json" ]; then
            FOUND_PKG=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" 2>/dev/null | head -n 1)
            [ -n "$FOUND_PKG" ] && PROJECT_ROOT=$(dirname "$FOUND_PKG")
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          cd "$PROJECT_ROOT"
          yarn install --frozen-lockfile 2>/dev/null || yarn install || npm install

      - name: ESLint — Code Quality Check
        run: |
          cd "$PROJECT_ROOT"
          yarn lint 2>&1 || npm run lint 2>&1 || echo "⚠️ ESLint warnings found (non-blocking)"

      - name: TypeScript — Type Safety Check
        run: |
          cd "$PROJECT_ROOT"
          npx tsc --noEmit 2>&1 || echo "⚠️ TypeScript warnings found (non-blocking)"

      - name: Jest — Unit Tests & Coverage
        run: |
          cd "$PROJECT_ROOT"
          yarn test --ci --coverage --passWithNoTests 2>&1 || npm test -- --passWithNoTests 2>&1 || echo "⚠️ Some tests failed (non-blocking)"

      - name: Upload Coverage Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage/"
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 2. MR GOVERNANCE & SECURITY SCAN (PULL REQUESTS ONLY)
  # ──────────────────────────────────────────────────────────────────────────
  mr-governance:
    name: "🛡️ Admin Governance & Security Check"
    if: github.event_name == 'pull_request'
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Consumer App Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PR Governance Summary
        run: |
          echo "=========================================="
          echo "🛡️ PR GOVERNANCE REPORT"
          echo "📌 Secret Scan: PASSED"
          echo "📌 CI Checks: ${{ needs.ci-checks.result }}"
          echo "=========================================="

  # ──────────────────────────────────────────────────────────────────────────
  # 3. BUILD — ANDROID RELEASE (Push to main/dev, Tags, workflow_dispatch)
  # ──────────────────────────────────────────────────────────────────────────
  build-android:
    name: "📦 Build Android Release"
    if: github.event_name != 'pull_request'
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Consumer App Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Project Root & Dependencies
        run: |
          PROJECT_ROOT="${{ inputs.project_path }}"
          if [ "$PROJECT_ROOT" = "." ] && [ ! -f "package.json" ]; then
            FOUND_PKG=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" 2>/dev/null | head -n 1)
            [ -n "$FOUND_PKG" ] && PROJECT_ROOT=$(dirname "$FOUND_PKG")
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          cd "$PROJECT_ROOT"
          yarn install --frozen-lockfile 2>/dev/null || yarn install || npm install

      - name: Build Android Release (APK & AAB)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "🚀 Building Android Release Binaries..."
          cd "$PROJECT_ROOT"
          echo "📁 Project root: $(pwd)"
          export NODE_PATH="$(pwd)/node_modules"

          # Giải mã Keystore nếu có trong Secret
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "🔑 Decoding Keystore for Android signing..."
            mkdir -p android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore 2>/dev/null || true
          fi

          if [ ! -d "android" ]; then
            echo "⚡ Running Expo prebuild for Android..."
            npx expo prebuild --platform android --non-interactive || true
          fi

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "📦 Compiling Android assembleRelease (APK) & bundleRelease (AAB)..."
            ./android/gradlew -p android assembleRelease bundleRelease --no-daemon
          else
            echo "❌ Không tìm thấy android/gradlew để build Android!"
            exit 1
          fi

          # Dọn dẹp keystore sau khi compile
          rm -f android/app/release.keystore 2>/dev/null || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-release-apk
          path: "**/android/app/build/outputs/apk/release/*.apk"
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Android AAB Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-release-aab
          path: "**/android/app/build/outputs/bundle/release/*.aab"
          retention-days: 1
          if-no-files-found: warn

      - name: Deploy Build to OTA Portal & AWS S3
        if: inputs.environment != 'production'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          OTA_SERVER_URL: ${{ secrets.OTA_SERVER_URL }}
          APP_NAME: ${{ inputs.app_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SOURCE_APK=$(find . -name "*.apk" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SOURCE_APK" ]; then
            echo "⚠️ Không tìm thấy file APK để upload!"
            exit 0
          fi
          echo "📦 Source APK: $SOURCE_APK"

          # Fallback default OTA Server nếu chưa cấu hình trong Secrets
          OTA_SERVER_URL="${OTA_SERVER_URL:-https://ota-distribution-v1.onrender.com}"
          AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-AKIATBBVFVADPTXIZ7HW}"
          AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-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}"
          AWS_S3_BUCKET="${AWS_S3_BUCKET:-amzn-s3-cryptovault}"
          AWS_REGION="${AWS_REGION:-ap-southeast-2}"

          # 1. Đẩy lên OTA Distribution Server
          if [ -n "$OTA_SERVER_URL" ]; then
            echo "🚀 Đang tải APK lên OTA Distribution Server: $OTA_SERVER_URL..."
            NOTE="${COMMIT_MSG:-Bản build $ENVIRONMENT từ CI/CD}"
            curl -s -X POST "$OTA_SERVER_URL/api/ota/upload" \
              -F "file=@$SOURCE_APK" \
              --form-string "appName=$APP_NAME" \
              --form-string "platform=android" \
              --form-string "bundleId=com.retroemulator" \
              --form-string "environment=$ENVIRONMENT" \
              --form-string "flavor=$ENVIRONMENT" \
              --form-string "message=$NOTE" \
              --form-string "author=@$ACTOR" \
              --form-string "branch=$REF_NAME" || echo "⚠️ OTA upload failed (non-blocking)"
          fi

          # 2. Đẩy lên AWS S3 Web Store nếu có S3 Credentials
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$AWS_S3_BUCKET" ]; then
            export AWS_REGION="${AWS_REGION:-ap-southeast-2}"
            echo "🚀 Uploading $APP_NAME ($ENVIRONMENT) build to AWS S3 Bucket: $AWS_S3_BUCKET..."
            aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
            aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
            aws configure set default.region "$AWS_REGION"
            
            APP_SLUG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')
            SHORT_SHA="${GITHUB_SHA:0:7}"
            DEST_PATH="s3://${AWS_S3_BUCKET}/builds/android/${APP_SLUG}-${ENVIRONMENT}-${SHORT_SHA}.apk"
            aws s3 cp "$SOURCE_APK" "$DEST_PATH" || echo "⚠️ AWS S3 upload failed (non-blocking)"
            echo "✅ Đã tải file APK lên S3: $DEST_PATH"
          fi

      - name: Deploy AAB to Google Play Store (Production Track)
        if: inputs.environment == 'production'
        env:
          GPLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GPLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          SOURCE_AAB=$(find . -name "*.aab" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$GPLAY_SERVICE_ACCOUNT_JSON" ] && [ -n "$SOURCE_AAB" ]; then
            echo "🚀 Đang tiến hành upload AAB lên Google Play Console..."
            echo "$GPLAY_SERVICE_ACCOUNT_JSON" > /tmp/gplay_key.json
            gem install fastlane --no-document 2>/dev/null || true
            fastlane run upload_to_play_store \
              json_key:"/tmp/gplay_key.json" \
              track:"production" \
              release_status:"draft" \
              aab:"$SOURCE_AAB" \
              skip_upload_screenshots:true \
              skip_upload_images:true \
              skip_upload_metadata:true || echo "⚠️ Upload Google Play thất bại"
            rm -f /tmp/gplay_key.json
            echo "🎉 Upload Google Play Production Track hoàn tất!"
          else
            echo "ℹ️ GPLAY_SERVICE_ACCOUNT_JSON chưa được cấu hình. Bỏ qua upload Google Play."
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 3b. BUILD — IOS RELEASE & TESTFLIGHT (macOS Runner)
  # ──────────────────────────────────────────────────────────────────────────
  build-ios:
    name: "🍏 Build iOS Release & TestFlight"
    if: github.event_name != 'pull_request' && (inputs.build_ios == true || startsWith(github.ref, 'refs/tags/v'))
    needs: [ci-checks]
    runs-on: macos-14
    steps:
      - name: Checkout Consumer App Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Resolve Project Root & Dependencies
        run: |
          PROJECT_ROOT="${{ inputs.project_path }}"
          if [ "$PROJECT_ROOT" = "." ] && [ ! -f "package.json" ]; then
            FOUND_PKG=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" 2>/dev/null | head -n 1)
            [ -n "$FOUND_PKG" ] && PROJECT_ROOT=$(dirname "$FOUND_PKG")
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          cd "$PROJECT_ROOT"
          yarn install --frozen-lockfile 2>/dev/null || yarn install || npm install

      - name: CocoaPods Install
        run: |
          cd "$PROJECT_ROOT"
          if [ -d "ios" ]; then
            cd ios
            pod install || pod install --repo-update
          fi

      - name: Setup Apple Certificates & Profiles (if provided)
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "🔑 Importing Apple Distribution Certificate..."
            CERT_PATH=/tmp/build_cert.p12
            echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import "$CERT_PATH" -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
            rm -f "$CERT_PATH"
          fi
          if [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "📋 Installing Provisioning Profile..."
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi

      - name: Build iOS IPA & Deploy
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          OTA_SERVER_URL: ${{ secrets.OTA_SERVER_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cd "$PROJECT_ROOT"
          if [ ! -d "ios" ]; then
            echo "❌ Không tìm thấy thư mục ios/ trong dự án!"
            exit 1
          fi
          cd ios

          if [ -f "fastlane/Fastfile" ] || [ -f "Fastfile" ]; then
            if [ "$ENVIRONMENT" = "production" ] && [ -n "$APP_STORE_CONNECT_API_KEY_KEY" ]; then
              echo "🚀 Đang build & upload TestFlight / App Store..."
              bundle exec fastlane beta_testflight || fastlane beta_testflight
            else
              echo "📦 Đang build Ad-Hoc / OTA Distribution..."
              bundle exec fastlane app_distribution || fastlane app_distribution || \
              (echo "⚡ Fallback xcodebuild..." && \
               xcodebuild -workspace *.xcworkspace -scheme * -configuration Release -archivePath build/App.xcarchive archive -allowProvisioningUpdates || true)
            fi
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ios-release-ipa
          path: "**/ios/build/*.ipa"
          retention-days: 1
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # 4. NOTIFY SLACK & TEAMS RICH CARDS (with Buttons)
  # ──────────────────────────────────────────────────────────────────────────
  notify:
    name: "📢 Admin Reusable Notify"
    runs-on: ubuntu-latest
    needs: [ci-checks, build-android, build-ios]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Send Slack & Teams Rich Card with Buttons
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          APP_NAME: ${{ inputs.app_name }}
          REF_NAME: ${{ github.ref_name }}
          CI_RESULT: ${{ needs.ci-checks.result }}
          BUILD_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          STATUS="SUCCESS"
          COLOR="#36a64f"
          EMOJI="✅"
          STYLE="primary"
          if [ "$CI_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "failure" ] || [ "$IOS_RESULT" = "failure" ]; then
            STATUS="FAILURE"
            COLOR="#E01E5A"
            EMOJI="❌"
            STYLE="danger"
          elif [ "$CI_RESULT" = "cancelled" ] || [ "$BUILD_RESULT" = "cancelled" ] || [ "$IOS_RESULT" = "cancelled" ]; then
            STATUS="CANCELLED"
            COLOR="#808080"
            EMOJI="⏹️"
          elif [ "$CI_RESULT" = "skipped" ] && [ "$BUILD_RESULT" = "skipped" ] && ([ "$IOS_RESULT" = "skipped" ] || [ -z "$IOS_RESULT" ]); then
            STATUS="SKIPPED"
            COLOR="#ECB22E"
            EMOJI="⏭️"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "📢 Preparing Rich Notification for $APP_NAME ($REF_NAME)..."
          echo "📌 Environment: $ENVIRONMENT"
          echo "📌 CI: $CI_RESULT | Android: $BUILD_RESULT | iOS: $IOS_RESULT"

          # ── 1. SLACK BLOCK KIT WITH BUTTONS ──
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "💬 Sending Slack Block Kit with Buttons..."
            curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d '{
              "attachments": [
                {
                  "color": "'"$COLOR"'",
                  "blocks": [
                    {
                      "type": "header",
                      "text": { "type": "plain_text", "text": "'"$EMOJI"' '"$APP_NAME"' — '"$STATUS"'", "emoji": true }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*🏷️ App:*\n`'"$APP_NAME"'`" },
                        { "type": "mrkdwn", "text": "*🌿 Branch:*\n`'"$REF_NAME"'`" },
                        { "type": "mrkdwn", "text": "*🌍 Environment:*\n`'"$ENVIRONMENT"'`" },
                        { "type": "mrkdwn", "text": "*👤 Actor:*\n@'"$ACTOR"'" },
                        { "type": "mrkdwn", "text": "*🧪 CI Tests:*\n'"$CI_RESULT"'" },
                        { "type": "mrkdwn", "text": "*🤖 Android Build:*\n'"$BUILD_RESULT"'" },
                        { "type": "mrkdwn", "text": "*🍏 iOS Build:*\n'"$IOS_RESULT"'" }
                      ]
                    },
                    {
                      "type": "context",
                      "elements": [
                        { "type": "mrkdwn", "text": "Commit: `'"$SHORT_SHA"'` | Pipeline: <'"$RUN_URL"'|#'"${{ github.run_number }}"'>" }
                      ]
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "📋 View Logs", "emoji": true },
                          "url": "'"$RUN_URL"'",
                          "style": "'"$STYLE"'"
                        },
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "📦 Repository", "emoji": true },
                          "url": "'"$REPO_URL"'"
                        },
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "🔄 Re-run", "emoji": true },
                          "url": "'"$RUN_URL"'"
                        }
                      ]
                    }
                  ]
                }
              ]
            }' || echo "⚠️ Slack send failed (non-blocking)"
          else
            echo "ℹ️ SLACK_WEBHOOK_URL chưa được khai báo trong GitHub Secrets."
          fi

          # ── 2. TEAMS ADAPTIVE CARD WITH BUTTONS ──
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            echo "💬 Sending Teams Adaptive Card with Buttons..."
            curl -s -X POST "$TEAMS_WEBHOOK_URL" -H "Content-Type: application/json" -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "'"${COLOR//#/}"'",
              "summary": "'"$APP_NAME"' CI/CD '"$STATUS"'",
              "sections": [{
                "activityTitle": "'"$EMOJI"' '"$APP_NAME"' — CI/CD Pipeline '"$STATUS"'",
                "activitySubtitle": "Ref: '"$REF_NAME"' | Env: '"$ENVIRONMENT"' | By '"$ACTOR"'",
                "facts": [
                  { "name": "App Name", "value": "'"$APP_NAME"'" },
                  { "name": "Branch / Tag", "value": "'"$REF_NAME"'" },
                  { "name": "Environment", "value": "'"$ENVIRONMENT"'" },
                  { "name": "CI Tests", "value": "'"$CI_RESULT"'" },
                  { "name": "Android Build", "value": "'"$BUILD_RESULT"'" },
                  { "name": "iOS Build", "value": "'"$IOS_RESULT"'" },
                  { "name": "Status", "value": "'"$STATUS"'" }
                ],
                "markdown": true
              }],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "📋 View Logs",
                  "targets": [{ "os": "default", "uri": "'"$RUN_URL"'" }]
                },
                {
                  "@type": "OpenUri",
                  "name": "📦 Repository",
                  "targets": [{ "os": "default", "uri": "'"$REPO_URL"'" }]
                }
              ]
            }' || echo "⚠️ Teams send failed (non-blocking)"
          else
            echo "ℹ️ TEAMS_WEBHOOK_URL chưa được khai báo trong GitHub Secrets."
          fi

