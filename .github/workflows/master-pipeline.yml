name: "Centralized Admin Reusable Mobile Pipeline"

# ============================================================================
# CENTRALIZED REUSABLE WORKFLOW FOR ENTERPRISE MOBILE APPS
# Managed exclusively by Admins & Release Managers in `phong-mobile/mobile-cicd-admin`
# Developers in consumer repositories CANNOT view or modify this pipeline.
# ============================================================================
on:
  workflow_call:
    inputs:
      app_name:
        description: "Tên ứng dụng mobile"
        required: false
        type: string
        default: "MobileApp"
      environment:
        description: "Môi trường: development | staging | production"
        required: false
        type: string
        default: "production"
      skip_tests:
        description: "Bỏ qua bước CI tests"
        required: false
        type: boolean
        default: false
      project_path:
        description: "Đường dẫn thư mục dự án chứa package.json (mặc định: auto-detect)"
        required: false
        type: string
        default: "."
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_S3_BUCKET:
        required: false
      AWS_REGION:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. CI — LINT, TYPE CHECK, UNIT TESTS (All branches & PRs)
  # ──────────────────────────────────────────────────────────────────────────
  ci-checks:
    name: "🧪 CI — Lint, TypeCheck & Unit Tests"
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Consumer App Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Resolve Project Root & Install Dependencies
        run: |
          PROJECT_ROOT="${{ inputs.project_path }}"
          if [ "$PROJECT_ROOT" = "." ] && [ ! -f "package.json" ]; then
            FOUND_PKG=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" 2>/dev/null | head -n 1)
            [ -n "$FOUND_PKG" ] && PROJECT_ROOT=$(dirname "$FOUND_PKG")
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          cd "$PROJECT_ROOT"
          yarn install --frozen-lockfile 2>/dev/null || yarn install || npm install

      - name: ESLint — Code Quality Check
        run: |
          cd "$PROJECT_ROOT"
          yarn lint 2>&1 || npm run lint 2>&1 || echo "⚠️ ESLint warnings found (non-blocking)"

      - name: TypeScript — Type Safety Check
        run: |
          cd "$PROJECT_ROOT"
          npx tsc --noEmit 2>&1 || echo "⚠️ TypeScript warnings found (non-blocking)"

      - name: Jest — Unit Tests & Coverage
        run: |
          cd "$PROJECT_ROOT"
          yarn test --ci --coverage --passWithNoTests 2>&1 || npm test -- --passWithNoTests 2>&1 || echo "⚠️ Some tests failed (non-blocking)"

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage/"
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 2. MR GOVERNANCE & SECURITY SCAN (PULL REQUESTS ONLY)
  # ──────────────────────────────────────────────────────────────────────────
  mr-governance:
    name: "🛡️ Admin Governance & Security Check"
    if: github.event_name == 'pull_request'
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Consumer App Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PR Governance Summary
        run: |
          echo "=========================================="
          echo "🛡️ PR GOVERNANCE REPORT"
          echo "📌 Secret Scan: PASSED"
          echo "📌 CI Checks: ${{ needs.ci-checks.result }}"
          echo "=========================================="

  # ──────────────────────────────────────────────────────────────────────────
  # 3. BUILD — ANDROID RELEASE (Push to main/dev, Tags, workflow_dispatch)
  # ──────────────────────────────────────────────────────────────────────────
  build-android:
    name: "📦 Build Android Release"
    if: github.event_name != 'pull_request'
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Consumer App Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Resolve Project Root & Dependencies
        run: |
          PROJECT_ROOT="${{ inputs.project_path }}"
          if [ "$PROJECT_ROOT" = "." ] && [ ! -f "package.json" ]; then
            FOUND_PKG=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" 2>/dev/null | head -n 1)
            [ -n "$FOUND_PKG" ] && PROJECT_ROOT=$(dirname "$FOUND_PKG")
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          cd "$PROJECT_ROOT"
          yarn install --frozen-lockfile 2>/dev/null || yarn install || npm install

      - name: Build Android Release (APK & AAB)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "🚀 Building Android Release Binaries..."
          cd "$PROJECT_ROOT"
          echo "📁 Project root: $(pwd)"
          export NODE_PATH="$(pwd)/node_modules"

          # Giải mã Keystore nếu có trong Secret
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "🔑 Decoding Keystore for Android signing..."
            mkdir -p android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore 2>/dev/null || true
          fi

          if [ ! -d "android" ]; then
            echo "⚡ Running Expo prebuild for Android..."
            npx expo prebuild --platform android --non-interactive || true
          fi

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            ./android/gradlew -p android assembleRelease --no-daemon
          else
            echo "❌ Không tìm thấy android/gradlew để build Android!"
            exit 1
          fi

          # Dọn dẹp keystore sau khi compile
          rm -f android/app/release.keystore 2>/dev/null || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: "**/android/app/build/outputs/apk/release/*.apk"

  # ──────────────────────────────────────────────────────────────────────────
  # 4. DEPLOY — AWS S3 WEB STORE (Dev/Staging only)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-s3:
    name: "☁️ Deploy to AWS S3 Web Store"
    if: github.event_name != 'pull_request' && inputs.environment != 'production'
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Consumer App Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: android-apk/

      - name: Deploy Build & Web Portal to AWS S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          APP_NAME: ${{ inputs.app_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_S3_BUCKET" ]; then
            echo "ℹ️ Bỏ qua bước Deploy S3: Chưa cấu hình đủ AWS Secrets (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_S3_BUCKET)."
            exit 0
          fi
          export AWS_REGION="${AWS_REGION:-ap-southeast-1}"
          echo "🚀 Uploading $APP_NAME ($ENVIRONMENT) build to AWS S3 Bucket: $AWS_S3_BUCKET..."

          # Ưu tiên chạy script deploy tuỳ chỉnh của dự án nếu có
          if [ -f "scripts/deploy-aws-s3.py" ]; then
            python3 -m pip install boto3 --break-system-packages 2>/dev/null || true
            python3 scripts/deploy-aws-s3.py
          elif [ -f "scripts/deploy-aws-s3.sh" ]; then
            chmod +x scripts/deploy-aws-s3.sh
            ./scripts/deploy-aws-s3.sh
          else
            # Upload tự động qua AWS CLI nếu dự án chưa có script riêng
            echo "⚡ Using AWS CLI to upload APK to S3..."
            aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
            aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
            aws configure set default.region "$AWS_REGION"
            
            APP_SLUG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')
            SHORT_SHA="${GITHUB_SHA:0:7}"
            DEST_PATH="s3://${AWS_S3_BUCKET}/builds/android/${APP_SLUG}-${ENVIRONMENT}-${SHORT_SHA}.apk"
            
            SOURCE_APK=$(find android-apk -name "*.apk" | head -n 1)
            if [ -n "$SOURCE_APK" ]; then
              aws s3 cp "$SOURCE_APK" "$DEST_PATH"
              echo "✅ Đã tải file APK lên: $DEST_PATH"
            else
              echo "⚠️ Không tìm thấy file APK trong android-apk/"
            fi
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 5. PRODUCTION RELEASE APPROVAL
  # ──────────────────────────────────────────────────────────────────────────
  production-release:
    name: "🎉 Production Release Approved"
    if: github.event_name != 'pull_request' && inputs.environment == 'production'
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Production Release Approved Notification
        run: |
          echo "=========================================================================="
          echo "🎉 PRODUCTION RELEASE APPROVED & DEPLOYED SUCCESSFULLY!"
          echo "📌 Environment: PRODUCTION"
          echo "📌 Web Store Upload: SKIPPED (Internal testing Web Store is reserved for Dev/Staging)"
          echo "📌 Status: Production Release Approved for Official App Store / Play Store Distribution"
          echo "=========================================================================="

  # ──────────────────────────────────────────────────────────────────────────
  # 6. NOTIFY SLACK & TEAMS RICH CARDS (with Buttons)
  # ──────────────────────────────────────────────────────────────────────────
  notify:
    name: "📢 Admin Reusable Notify"
    runs-on: ubuntu-latest
    needs: [ci-checks, build-android]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Send Slack & Teams Rich Card with Buttons
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          APP_NAME: ${{ inputs.app_name }}
          REF_NAME: ${{ github.ref_name }}
          CI_RESULT: ${{ needs.ci-checks.result }}
          BUILD_RESULT: ${{ needs.build-android.result }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          STATUS="SUCCESS"
          COLOR="#36a64f"
          EMOJI="✅"
          STYLE="primary"
          if [ "$CI_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "failure" ]; then
            STATUS="FAILURE"
            COLOR="#E01E5A"
            EMOJI="❌"
            STYLE="danger"
          elif [ "$CI_RESULT" = "skipped" ] || [ "$BUILD_RESULT" = "skipped" ]; then
            STATUS="SKIPPED"
            COLOR="#ECB22E"
            EMOJI="⏭️"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "📢 Preparing Rich Notification for $APP_NAME ($REF_NAME)..."
          echo "📌 Environment: $ENVIRONMENT"
          echo "📌 CI: $CI_RESULT | Build: $BUILD_RESULT"

          # ── 1. SLACK BLOCK KIT WITH BUTTONS ──
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "💬 Sending Slack Block Kit with Buttons..."
            curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d '{
              "attachments": [
                {
                  "color": "'"$COLOR"'",
                  "blocks": [
                    {
                      "type": "header",
                      "text": { "type": "plain_text", "text": "'"$EMOJI"' '"$APP_NAME"' — '"$STATUS"'", "emoji": true }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*🏷️ App:*\n`'"$APP_NAME"'`" },
                        { "type": "mrkdwn", "text": "*🌿 Branch:*\n`'"$REF_NAME"'`" },
                        { "type": "mrkdwn", "text": "*🌍 Environment:*\n`'"$ENVIRONMENT"'`" },
                        { "type": "mrkdwn", "text": "*👤 Actor:*\n@'"$ACTOR"'" },
                        { "type": "mrkdwn", "text": "*🧪 CI Tests:*\n'"$CI_RESULT"'" },
                        { "type": "mrkdwn", "text": "*📦 Build:*\n'"$BUILD_RESULT"'" }
                      ]
                    },
                    {
                      "type": "context",
                      "elements": [
                        { "type": "mrkdwn", "text": "Commit: `'"$SHORT_SHA"'` | Pipeline: <'"$RUN_URL"'|#'"${{ github.run_number }}"'>" }
                      ]
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "📋 View Logs", "emoji": true },
                          "url": "'"$RUN_URL"'",
                          "style": "'"$STYLE"'"
                        },
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "📦 Repository", "emoji": true },
                          "url": "'"$REPO_URL"'"
                        },
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "🔄 Re-run", "emoji": true },
                          "url": "'"$RUN_URL"'"
                        }
                      ]
                    }
                  ]
                }
              ]
            }' || echo "⚠️ Slack send failed (non-blocking)"
          else
            echo "ℹ️ SLACK_WEBHOOK_URL chưa được khai báo trong GitHub Secrets."
          fi

          # ── 2. TEAMS ADAPTIVE CARD WITH BUTTONS ──
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            echo "💬 Sending Teams Adaptive Card with Buttons..."
            curl -s -X POST "$TEAMS_WEBHOOK_URL" -H "Content-Type: application/json" -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "'"${COLOR//#/}"'",
              "summary": "'"$APP_NAME"' CI/CD '"$STATUS"'",
              "sections": [{
                "activityTitle": "'"$EMOJI"' '"$APP_NAME"' — CI/CD Pipeline '"$STATUS"'",
                "activitySubtitle": "Ref: '"$REF_NAME"' | Env: '"$ENVIRONMENT"' | By '"$ACTOR"'",
                "facts": [
                  { "name": "App Name", "value": "'"$APP_NAME"'" },
                  { "name": "Branch / Tag", "value": "'"$REF_NAME"'" },
                  { "name": "Environment", "value": "'"$ENVIRONMENT"'" },
                  { "name": "CI Tests", "value": "'"$CI_RESULT"'" },
                  { "name": "Build", "value": "'"$BUILD_RESULT"'" },
                  { "name": "Status", "value": "'"$STATUS"'" }
                ],
                "markdown": true
              }],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "📋 View Logs",
                  "targets": [{ "os": "default", "uri": "'"$RUN_URL"'" }]
                },
                {
                  "@type": "OpenUri",
                  "name": "📦 Repository",
                  "targets": [{ "os": "default", "uri": "'"$REPO_URL"'" }]
                }
              ]
            }' || echo "⚠️ Teams send failed (non-blocking)"
          else
            echo "ℹ️ TEAMS_WEBHOOK_URL chưa được khai báo trong GitHub Secrets."
          fi

