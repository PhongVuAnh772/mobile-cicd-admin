name: "🚀 Deploy OTA Distribution Portal to Render"

on:
  push:
    branches: [main]
    paths:
      - 'ota-distribution/**'
      - 'render.yaml'
  workflow_dispatch:
    inputs:
      trigger_render:
        description: "Trigger Render Deploy Hook"
        required: false
        type: boolean
        default: true

jobs:
  build-and-deploy:
    name: "🐳 Build Docker & Deploy to Render"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 1. Push to GHCR (GitHub Packages - Luôn khả dụng với GITHUB_TOKEN) ──
      - name: Lowercase Repository Owner for Docker
        id: meta
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push GHCR Image
        uses: docker/build-push-action@v5
        with:
          context: ./ota-distribution
          file: ./ota-distribution/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/ota-distribution:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/ota-distribution:v1

      # ── 2. Push to Docker Hub (nếu có DOCKER_USERNAME / DOCKER_PASSWORD) ──
      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Hub Image
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v5
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          context: ./ota-distribution
          file: ./ota-distribution/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ota-distribution:latest
            ${{ secrets.DOCKER_USERNAME }}/ota-distribution:v1

      # ── 3. Trigger Render Deploy Hook (nếu có cấu hình) ──
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🌐 Triggering Render Deploy Hook..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Render deployment triggered successfully (HTTP $HTTP_STATUS)!"
          else
            echo "⚠️ Render deploy hook returned HTTP $HTTP_STATUS"
          fi
